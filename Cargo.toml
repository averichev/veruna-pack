[package]
name = "veruna-pack"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "Local, signed multi-platform application releases from Conventional Commits"
license = "MIT"
repository = "https://github.com/averichev/veruna-pack"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
dialoguer = { version = "0.12", default-features = false }
ed25519-dalek = { version = "2.2", features = ["pkcs8", "pem"] }
flate2 = "1"
fs2 = "0.4"
goblin = "0.10"
libc = "0.2"
minisign = "0.10"
node-semver = "2.2"
pkcs8 = { version = "0.10", features = ["encryption", "pem"] }
plist = "1"
regex = "1"
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
toml = "0.9"
uuid = "1"
xz2 = { version = "0.1", features = ["static"] }
zeroize = { version = "1", features = ["derive"] }
zstd = "0.13"

[dev-dependencies]
